<!DOCTYPE html>
<html lang="en" class="dark z-layout-small">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Steam Value Rankings</title>
  <link rel="stylesheet" href="/vendor/0build/0.6.13/kit.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link z-button z-button-primary" href="#rankings">Skip to rankings</a>
  <main class="page-shell">
    <header class="page-header">
      <div class="title-block">
        <h1 class="z-h2">Steam Value Rankings</h1>
        <p id="sync-status" class="page-description" role="status" aria-live="polite"></p>
      </div>
      <nav class="view-nav" aria-label="Game views">
        <a class="z-button z-button-secondary" href="/" aria-current="page">Rankings</a>
        <a class="z-button z-button-default" href="/city-builders">City builders</a>
      </nav>
    </header>
    <form class="filters z-card z-card-body" aria-label="Filter games">
      <div class="checkbox-filters">
        <label><input class="z-checkbox" type="checkbox" id="on-sale"> On sale or in bundle</label>
        <label><input class="z-checkbox" type="checkbox" id="steam-only"> Activates on Steam only</label>
        <label><input class="z-checkbox" type="checkbox" id="hide-ea"> Hide Early Access</label>
        <label><input class="z-checkbox" type="checkbox" id="hide-played"> Hide Played</label>
        <label><input class="z-checkbox" type="checkbox" id="hide-mmo"> Hide MMO</label>
        <label><input class="z-checkbox" type="checkbox" id="hide-ignored" checked> Hide Ignored</label>
        <label><input class="z-checkbox" type="checkbox" id="single-only"> Single-player only</label>
      </div>
      <div class="select-filters">
        <div>
          <label class="z-form-label" for="coop-filter">Co-op</label>
          <select class="z-select" id="coop-filter">
            <option value="any">Any</option>
            <option value="has-coop">Has Co-op</option>
            <option value="online-coop">Online Co-op</option>
            <option value="local-coop">Local Co-op</option>
          </select>
        </div>
        <div>
          <label class="z-form-label" for="controller-filter">Controller</label>
          <select class="z-select" id="controller-filter">
            <option value="any">Any</option>
            <option value="full">Full only</option>
            <option value="partial">Partial+</option>
          </select>
        </div>
      </div>
    </form>
    <section id="rankings" class="results" aria-label="Rankings" tabindex="-1">
      <div class="table-shell rankings-table-shell z-card" role="region" aria-label="Ranked games table" tabindex="0">
        <table class="z-table z-table-small z-table-divider z-table-hover rankings-table">
          <thead>
            <tr>
              <th scope="col" title="Wishlist"><abbr title="Wishlist">WL</abbr></th>
              <th scope="col" title="Owned">Own</th>
              <th scope="col">#</th>
              <th scope="col">Game</th>
              <th scope="col">Deals</th>
              <th scope="col" class="numeric" title="Value Score">Score</th>
              <th scope="col" class="numeric">Reviews</th>
              <th scope="col" class="numeric"><abbr title="HowLongToBeat Estimate">HLTB</abbr></th>
              <th scope="col" class="numeric" title="Your recorded Playtime">Played</th>
              <th scope="col" title="Single/Multiplayer">Mode</th>
              <th scope="col"><abbr title="Early Access">EA</abbr></th>
              <th scope="col">Controller</th>
            </tr>
          </thead>
          <tbody id="games-list"></tbody>
        </table>
      </div>
      <section id="games-cards" class="games-cards" aria-label="Ranked games"></section>
      <p id="games-empty" class="z-alert status-message" role="status" hidden></p>
      <p id="games-error" class="z-alert z-alert-warning status-message" role="alert" hidden></p>
      <div id="loading" class="loading-state" role="status">Loading games…</div>
      <div class="pagination"><button id="load-more" class="z-button z-button-primary" type="button" style="display: none;">Load More</button></div>
    </section>
    <footer class="page-footer deal-attribution">Deals from <a class="z-link" href="https://isthereanydeal.com/" target="_blank" rel="noopener noreferrer">IsThereAnyDeal</a></footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
