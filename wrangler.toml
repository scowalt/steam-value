name = "steam-value"
main = "dist/worker/index.js"
compatibility_date = "2026-05-22"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/assets"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "steam-value"
database_id = "e5b725a0-ea0e-4a1a-b013-1e8801936266"
migrations_dir = "migrations"
remote = false

[observability]
enabled = true
