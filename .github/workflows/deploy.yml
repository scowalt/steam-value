name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested current main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Reject stale or rerun commits
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$TESTED_SHA" = "$current_sha" || {
            echo "Refusing to deploy a tested commit that is no longer current main."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v3
      - name: Install deployment dependencies
        run: bun install --frozen-lockfile
      - name: Download tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh run download "$RUN_ID" --name "worker-$TESTED_SHA" --dir dist
      - name: Deploy tested commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          bunx wrangler deploy
          --no-bundle
          --strict
          --keep-vars
          --message "GitHub commit $TESTED_SHA"
          --tag "$TESTED_SHA"
