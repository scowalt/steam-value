name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test
        run: bun test
      - name: Typecheck and build
        run: bun run build
      - name: Preserve tested deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Install deployment dependencies
        run: bun install --frozen-lockfile
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: dist
      - name: Deploy tested commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler deploy
          --no-bundle
          --strict
          --keep-vars
          --message "GitHub commit $GITHUB_SHA"
          --tag "$GITHUB_SHA"
